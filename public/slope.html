<!DOCTYPE html>
<html>
<head>
    <base target="_blank">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/gh/cookieclickerunblocked/slp@ddcf1d475e4c9f0c58a6b0cf0cba75b25896b657/style/style.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .game-wrapper {
            display: flex;
            align-items: center;
        }
        button#run_game {
            font-family: inherit;
            appearance: none;
            border: 0;
            border-radius: 5px;
            background: #2c2c2c;
            color: #fff;
            padding: 18px 46px;
            font-size: 28px;
            cursor: pointer;
            z-index: 100;
        }
        button#run_game:hover {
            background: #3f3f3f;
        }
        button#run_game:focus {
            outline: none;
            box-shadow: 0 0 0 4px #cbd6ee;
        }
    </style>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/2.1.4/jquery.min.js"></script>
    <script src="https://www.id.net/api/user_data/autologin?callback=idnet_autologin&app_id=55961e5ee694aa0ae90003e8"></script>
    <script src="https://cdn.jsdelivr.net/gh/cookieclickerunblocked/slp@ddcf1d475e4c9f0c58a6b0cf0cba75b25896b657/UnityProgress.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/cookieclickerunblocked/slp@ddcf1d475e4c9f0c58a6b0cf0cba75b25896b657/UnityLoader.js"></script>
    <script type="text/javascript">
      var gameInstance;
      window.onload = function () {
        let bttn = document.createElement("button");
        bttn.appendChild(document.createTextNode("CLICK TO PLAY NOW"));
        bttn.setAttribute('id', 'run_game');
        bttn.style.position = 'absolute';
        document.body.appendChild(bttn);
        
        // Center the button
        bttn.style.left = '50%';
        bttn.style.top = '50%';
        bttn.style.transform = 'translate(-50%, -50%)';
        
        bttn.onclick = function () {
          gameInstance = UnityLoader.instantiate("gameContainer", "https://cdn.jsdelivr.net/gh/cookieclickerunblocked/slp@ddcf1d475e4c9f0c58a6b0cf0cba75b25896b657/slope_new.json", {
            onProgress: UnityProgress,
            Module: {
              onRuntimeInitialized: function() {
                UnityProgress(gameInstance, "complete")
              }
            }
          });
          this.remove();
        }
      }
    </script>
</head>
<body>
    <div class="game-wrapper">
        <div style="flex-direction: column; margin-right: 20px;">
            <iframe src="https://lablockedgames.com/160x600.html" width="160" height="600" frameborder="0" scrolling="no" allowfullscreen="true"></iframe>
        </div>
        
        <div class="webgl-content">
            <div id="gameContainer" style="width: 600px; height: 500px; margin: 0px; padding: 0px; border: 0px; position: relative; background: rgb(35, 31, 32);">
                <canvas id="#canvas" width="600" height="500"></canvas>
            </div>
        </div>
        
        <div style="flex-direction: column; margin-left: 20px;">
            <iframe src="https://lablockedgames.com/160x600.html" width="160" height="600" frameborder="0" scrolling="no" allowfullscreen="true"></iframe>
        </div>
    </div>
</body>
</html>
