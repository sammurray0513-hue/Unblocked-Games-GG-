<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Embed Wrapper</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #000; }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>
    <iframe id="content" allowfullscreen="true" allow="autoplay; fullscreen; pointer-lock"></iframe>
    <script>
        const url = window.location.hash.substring(1);
        if (url) {
            document.getElementById('content').src = url;
        } else {
            document.body.innerHTML = "<div style='color:white; text-align:center; margin-top:20%; font-family:sans-serif;'>No URL provided in hash.</div>";
        }
    </script>
</body>
</html>
